<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Habitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .card-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Nueva Habitación</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/habitaciones/guardar}" th:object="${habitacion}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Número</label>
                            <input type="text" th:field="*{numero}" class="form-control" placeholder="Ej: 101" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo</label>
                            <select th:field="*{tipo}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option value="SIMPLE">SIMPLE</option>
                                <option value="DOBLE">DOBLE</option>
                                <option value="SUITE">SUITE</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Precio por Noche ($)</label>
                            <input type="number" th:field="*{precioPorNoche}" class="form-control"
                                   placeholder="Ej: 80.00" step="0.01" min="0" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Disponibilidad</label>
                            <select th:field="*{disponible}" class="form-select">
                                <option value="true">Disponible</option>
                                <option value="false">Ocupada</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark flex-fill">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <a href="/habitaciones" class="btn btn-secondary flex-fill">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
